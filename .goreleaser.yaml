version: 2

project_name: requestsink

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: api
    main: ./cmd/api
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: ""
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Everything else
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^build:"

dockers_v2:
  - id: api
    dockerfile: Dockerfile
    tags:
      - "adamkirk94/request-sink:{{ .Version }}"
      - "adamkirk94/request-sink:latest"
    platforms:
      - linux/amd64
      - linux/arm64