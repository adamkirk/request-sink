name: "CI: Build"
run-name: "CI: Build #${{ github.event.pull_request.number }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set GoReleaser version override to commit SHA
        run: |
          echo "GORELEASER_CURRENT_VERSION=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "GORELEASER_CURRENT_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser (full release but skipping everything except docker)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: "Prepare docker context"
        run: |
          mkdir -p /tmp/amd64 /tmp/arm64 /tmp/docker-context
          mv dist/requestsink_Linux_arm64.tar.gz /tmp/arm64/requestsink_Linux_arm64.tar.gz
          mv dist/requestsink_Linux_x86_64.tar.gz /tmp/amd64/requestsink_Linux_x86_64.tar.gz
          ( cd /tmp/amd64 && tar -xzvf requestsink_Linux_x86_64.tar.gz && mv requestsink /tmp/docker-context/requestsink-amd64 )
          ( cd /tmp/arm64 && tar -xzvf requestsink_Linux_arm64.tar.gz && mv requestsink /tmp/docker-context/requestsink-arm64 )

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/docker-context
          file: ./Dockerfile
          push: true
          tags: |
            adamkirk94/request-sink:rc-${{ github.sha }}
          platforms: linux/amd64,linux/arm64


